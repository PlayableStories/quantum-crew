name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Uses the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Real WebSocket station + 1 TV + 4 phones, one Act II batch (~20 s).
      - run: pnpm smoke
      # A whole event session (in-process, fake clock): joining, a drop-out and rejoin, TV resume, Acts II and III.
      - run: pnpm session
      - run: pnpm build
